<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    {% for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}"
         class="{% if page.url == item.url %}active{% endif %}">
        {{ item.name }}
      </a>
    {% endfor %}
  </nav>
</header>
